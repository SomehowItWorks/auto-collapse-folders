name: Validate Plugin

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check main.js
      - run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8'))"
